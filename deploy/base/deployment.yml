apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: camel-evotempus
    version: 1.0.0
    group: io.hawt
  name: camel-evotempus
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: camel-evotempus
      group: io.hawt
  template:
    metadata:
      annotations:
        hawt.io/protocol: http
        hawt.io/jolokiaPath: /actuator/jolokia/
      labels:
        app: camel-evotempus
        provider: phantomjinx
        version: 1.0.0
        group: io.hawt
      name: camel-evotempus
    spec:
      containers:
      - name: camel-evotempus
        image: quay.io/phantomjinx/camel-evotempus:latest
        env:
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: AB_JOLOKIA_AUTH_OPENSHIFT
          value: "false"
        - name: AB_JOLOKIA_PASSWORD_RANDOM
          value: "false"
        - name: AB_JOLOKIA_OPTS
          value: "useSslClientAuthentication=false,protocol=https"
        - name: EVOTEMPUS_DB_HOST
          value: "localhost"
        - name: EVOTEMPUS_DB_USER
          valueFrom:
            secretKeyRef:
              name: evotempus-secret
              key: username
        - name: EVOTEMPUS_DB_PASSWD
          valueFrom:
            secretKeyRef:
              name: evotempus-secret
              key: password
        - name: EVOTEMPUS_DEST_DIR
          value: "/home/evotempus"
        imagePullPolicy: Always
        volumeMounts:
          - name: camel-evotempus-storage
            mountPath: /home/evotempus
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/jolokia/version
            port: 10001
            scheme: HTTP
          initialDelaySeconds: 180
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        ports:
        - containerPort: 10001
          name: jolokia
          protocol: TCP
        - containerPort: 10000
          name: ndmp
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /actuator/jolokia/version
            port: 10001
            scheme: HTTP
          initialDelaySeconds: 120
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            memory: 500Mi
          requests:
            memory: 256Mi
        securityContext:
          privileged: false
      - name: nginx-evotempus
        image: quay.io/phantomjinx/nginx-evotempus:latest
        imagePullPolicy: Always
        ports:
          - name: nginx
            containerPort: 8080
        livenessProbe:
          httpGet:
            path: /evotempus
            port: nginx
            scheme: HTTP
          periodSeconds: 10
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /evotempus
            port: nginx
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
        resources:
          requests:
            memory: 32Mi
          limits:
            memory: 500Mi
        volumeMounts:
          - name: camel-evotempus-storage
            mountPath: /usr/share/nginx/html/evotempus
      volumes:
        - name: camel-evotempus-storage
          emptyDir:
            sizeLimit: 500Mi
